openapi: '3.1.0'
info:
  title: API Title
  version: '1.0'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://localhost:3000/v1
   
paths:
  /skills:
    $ref: paths/Skills.yaml
  /skills/{id}:
   $ref: paths/SkillsById.yaml

components:
  securitySchemes:
   OAuth2:
      type: oauth2
      description: OAuth2 authorization for API access.
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:3000/oauth2/authorize
          tokenUrl: https://localhost:3000/oauth2/token
          scopes:
           Skills:read: read skills
           skills:edit: add,edit, delete skills
      
