get:
 tags: 
 - Skills
 summary: greturns List of my skills
 operationId: "ListSkills"
 security:
    - OAuth2:
        - Skills:read
 responses: 
   "200":
    description: "OK"
    content: 
     application/jsonl:
      schema:
       $ref: ../components/schemas/SkillsList.yaml
   "400":
    description: "Bad Request"
   "401":
    description: "Unathorized"

